services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-webchecker_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webchecker}
      MYSQL_USER: ${MYSQL_USER:-webchecker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-webchecker}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-webchecker_root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-changeme}
      AUTH_ENV_ALWAYS: ${AUTH_ENV_ALWAYS:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-key}
      JWT_TTL: ${JWT_TTL:-24h}
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-webchecker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-webchecker}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webchecker}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_SLOW_ALERTS: ${TELEGRAM_SLOW_ALERTS:-}
      STATS_RETENTION_DAYS: ${STATS_RETENTION_DAYS:-30}
      CHECKER_WORKERS: ${CHECKER_WORKERS:-8}
      CHECK_BLOCK_PRIVATE_HOSTS: ${CHECK_BLOCK_PRIVATE_HOSTS:-false}
      TZ: ${TZ:-Europe/Moscow}

volumes:
  mysql_data:
